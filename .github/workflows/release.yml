name: Release

# Two ways to release:
#  - Actions > Release > Run workflow, pick patch/minor/major: bumps version.properties,
#    commits, tags vX.Y.Z, builds and publishes the GitHub Release.
#  - Or edit version.properties yourself and push a matching tag (git tag v0.2.0 && git push origin v0.2.0).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/^versionName=//p' version.properties)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IFS=. read -r major minor patch <<< "${current%%-*}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            version="$major.$minor.$patch"
            sed -i "s/^versionName=.*/versionName=$version/" version.properties
          else
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$current" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version.properties ($current). Update the file first."
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key, so later releases won't install over it as updates."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "webOSControl-$TAG.apk"

      - name: Commit and tag the version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "webOSControl-$TAG.apk" --title "webOSControl $TAG" --generate-notes
