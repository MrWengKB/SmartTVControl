name: Release

# Same idea as HanziQuery's version-history.md: add a new "# vX.Y.Z" section at the top of
# versions.md and push to main. If that version has no release yet, this builds the APK and
# publishes it as release vX.Y.Z with that section as the release notes. Pushes that don't add a
# new version do nothing.
on:
  push:
    branches: [main]
    paths:
      - versions.md
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest version from versions.md
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First section (from the first heading to the next) = the newest version's notes.
          awk '/^[[:space:]]*#/{n++} n==1' versions.md > latest-notes.md
          VERSION=$(head -1 latest-notes.md | grep -oE '[vV][0-9]+\.[0-9]+\.[0-9]+' | head -1 | tr V v)
          if [ -z "$VERSION" ]; then
            echo "::error::The first heading of versions.md needs a version like '# v1.2.3'"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.new == 'true'

      - name: Decode signing key
        if: steps.version.outputs.new == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key, so later releases won't install over it as updates."
          fi

      - name: Build release APK
        if: steps.version.outputs.new == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "webOSControl-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tail -n +2 latest-notes.md > release-notes.md
          gh release create "$TAG" "webOSControl-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "webOSControl $TAG" \
            --notes-file release-notes.md \
            --latest
